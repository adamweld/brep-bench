# The cases cadrs builds by working around a feature its kernel lacks, and what that is
# (SPEC.md, "A workaround is flagged"). Blocks and cylinders are sketches extruded, as in a
# sketch-based modeller; balls, cones and tori are the kernel's primitives (`Kernel::primitive`).

"draft/cylinder-parted-both-ways" = "no draft of a face split at its parting line"
"chamfer/cube-all-edges" = "no corner face for chamfers"
"chamfer/octahedron-all-edges" = "no corner face for chamfers"
"thicken/angle-bracket-rounded" = "no thicken of a sheet of several faces"
"thicken/angle-bracket-sharp" = "no thicken of a sheet of several faces, no sharp thicken"
"thicken/open-box-outward-sharp" = "no sharp thicken"
"loft/slab-pinched-on-four-guides" = "no loft along guides"
"loft/square-spire-on-four-guides" = "no loft along guides"
"loft/square-to-octagon" = "no loft pairing a corner with a side"
"loft/square-to-round" = "no loft pairing a corner with an arc or a side with a point"
"loft/twisted-thin-blade" = "no loft along guides"
"sweep/hollow-reducer" = "no loft through a profile with holes"
"sweep/round-cornered-pipe" = "no round corner on a sweep"
"swept/ball-along-spline-groove" = "no sweep of a solid along a curve"
"loft/twisted-tapering-square" = "no loft along guides"
