[package]
name = "brep-bench-brepkit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The brep-bench runner for brepkit, and its implementation of every case."
publish = false

# brepkit (https://github.com/andymai/brepkit), as published on crates.io: one workspace released
# in lockstep, so every crate is pinned to the same version.
[dependencies]
brepkit-math = "=4.6.20"
brepkit-geometry = "=4.6.20"
brepkit-topology = "=4.6.20"
brepkit-operations = "=4.6.20"
brepkit-heal = "=4.6.20"
# its STEP writer, `step::write_step` (the crate has no features to narrow it to STEP alone)
brepkit-io = "=4.6.20"
serde_json = "1"

[profile.release]
debug = 0
