# The cases SolidCraft's kernel builds by working around a feature it lacks, and what that is
# (SPEC.md, "A workaround is flagged").

"nurbs/bspline-dome" = "no solid from a NURBS surface, no B-spline curve in a profile"
"nurbs/vault-tangent-plane" = "no NURBS surface of even degree"
"spline/peanut-prism" = "no B-spline curve in a profile"
"spline/rational-spheroid" = "no NURBS curve in a profile"
"sweep/narrowing-bend" = "no sweep with a law for its section"
"loft/slab-pinched-on-four-guides" = "no loft along four guides"
"loft/square-spire-on-four-guides" = "no loft along four guides"
"loft/square-to-octagon" = "no loft pairing a corner with a side"
"loft/square-to-round" = "no loft pairing a corner with an arc or a side with a point, no oblique cone"
"swept/ball-swung-groove" = "no sweep of a solid"
"swept/box-slid-aslant" = "no sweep of a solid"
"swept/torus-slid-through-rod" = "no sweep of a solid"
"swept/two-beads-slid-through-rod" = "no sweep of a solid"
"swept/ball-along-spline-groove" = "no sweep of a solid"
"swept/ball-thread-groove" = "no sweep of a solid"
"shell/l-block-open-top" = "no shell joined by arcs"
"chamfer/cube-all-edges" = "no chamfer corner cut flat"
"feature/hole-through-the-upper-arm" = "no hole through to the next face"
"feature/pad-down-to-cylinder" = "no extrusion up to a face"
"feature/post-up-to-dome" = "no extrusion up to a face"
"feature/rib-revolved-to-a-stop" = "no revolution up to a face"
"geometry/ellipsoid" = "no ellipsoid"
"geometry/ellipsoid-half" = "no ellipsoid"
"thicken/angle-bracket-rounded" = "no thickening with rounded edges"
"thicken/open-box-outward-rounded" = "no thickening with rounded edges"
"thicken/sphere-skin" = "no thickening of a closed sheet"
"fillet/conic-edge" = "no conic blend"
